# ==============================================================================
# CyberGuardian AI — Moteur de règles (Couche 1) — IA-4
# Version: 1.0 (baseline complète — 10/10 règles finalisées)
#
# Statut global:
#   - R01, R02, R03, R09 : seuils directement appuyés par les mesures de l'EDA v3.
#   - R04, R05, R06, R07, R08, R10 : baseline défendable faute de mesure EDA
#     directe sur ces signaux précis. A recalibrer via le harnais d'évaluation
#     IA-8 (precision fraude, rappel @1% FPR, AUC-PR) dès que du volume de
#     scoring réel est disponible — c'est précisément le rôle d'IA-8.
#
# Portée IA-4: uniquement le contenu des règles ci-dessous.
#   Le dépôt physique dans S3 et le rechargement à chaud (/reload-model)
#   relèvent d'IA-7 / IA-9, pas d'IA-4.
# ==============================================================================

rules:

  - id: R01
    name: "SIM swap récent + transaction importante"
    description: >
      Un swap SIM vient d'avoir lieu et il est immédiatement suivi d'une
      transaction dont le montant dépasse largement l'habitude de l'abonné.
      L'EDA v3 montre que le délai OTP->swap des fraudes est de 1 à 8 minutes
      (contre 5-90 minutes pour les swaps légitimes) : l'attaquant agit vite
      après avoir pris le contrôle de la ligne.
    signals:
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 1
      - feature: amount_ratio
        operator: ">"
        threshold: 3
    logic: AND
    score: 92
    severity: "Très élevée"
    status: "seuils appuyés par l'EDA"

  - id: R02
    name: "Nouveau device + transaction importante"
    description: >
      Une transaction significative est effectuée depuis un terminal jamais
      vu pour ce compte. Signal cohérent avec une prise de contrôle du
      compte depuis un nouvel appareil.
    signals:
      - feature: new_device
        operator: "=="
        threshold: true
      - feature: amount_ratio
        operator: ">"
        threshold: 3
    logic: AND
    score: 78
    severity: "Élevée"
    status: "seuils appuyés par l'EDA"

  - id: R03
    name: "Nouveau device après SIM swap"
    description: >
      Un nouveau device apparaît peu de temps après un swap SIM. Cumul de
      deux signaux individuellement déjà significatifs — indicateur fort
      de prise de contrôle complète de la ligne.
    signals:
      - feature: new_device
        operator: "=="
        threshold: true
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 2
    logic: AND
    score: 93
    severity: "Très élevée"
    status: "seuils appuyés par l'EDA"

  - id: R04
    name: "Pic inhabituel d'OTP"
    description: >
      Un nombre anormalement élevé de demandes OTP est observé sur une
      courte période, typique d'une tentative de contournement ou de
      multiples essais d'authentification par l'attaquant. Un abonné
      légitime ne demande quasiment jamais plus d'un OTP par heure ; on
      fixe donc le seuil à 3 pour laisser une marge aux erreurs de saisie
      normales tout en captant le comportement en rafale des attaquants.
    signals:
      - feature: otp_count_1h
        operator: ">="
        threshold: 3
    logic: SINGLE
    score: 72
    severity: "Élevée"
    status: "Baseline v1.0 — à recalibrer via IA-8"

  - id: R05
    name: "Vélocité excessive"
    description: >
      Un nombre de transactions anormalement élevé est effectué sur une
      courte fenêtre de temps, signe possible d'un vidage rapide du compte.
      La majorité des abonnés effectuent au plus 1 à 2 transactions par
      heure en usage normal (mobile money) ; 4 transactions en 1h sort
      nettement de ce cadre.
    signals:
      - feature: nb_tx_1h
        operator: ">="
        threshold: 4
    logic: SINGLE
    score: 70
    severity: "Élevée"
    status: "Baseline v1.0 — à recalibrer via IA-8"

  - id: R06
    name: "Montant très supérieur à l'habitude"
    description: >
      Le montant de la transaction dépasse fortement l'habitude de
      l'abonné, même en l'absence d'autre signal contextuel (device, swap,
      géo). Seuil volontairement plus strict que R01/R02/R09 puisque le
      signal est isolé.
    signals:
      - feature: amount_ratio
        operator: ">"
        threshold: 5
    logic: SINGLE
    score: 68
    severity: "Élevée"
    status: "Baseline v1.0 — à recalibrer via IA-8"

  - id: R07
    name: "Changement géographique important"
    description: >
      La transaction est effectuée depuis une antenne différente de
      l'antenne domicile de l'abonné. La comparaison directe à l'antenne
      domicile est disponible dès maintenant sans dépendance nouvelle.
    signals:
      - feature: is_roaming
        operator: "=="
        threshold: true
    logic: SINGLE
    score: 60
    severity: "Moyenne/élevée"
    status: "Baseline v1.0 — à recalibrer via IA-8"

  - id: R08
    name: "Cascade de transferts"
    description: >
      Plusieurs bénéficiaires différents reçoivent des transferts en peu de
      temps depuis le même compte — signature typique d'un vidage organisé
      en cascade après prise de contrôle.
    signals:
      - feature: nb_beneficiaires_1h
        operator: ">="
        threshold: 3
      - feature: nb_tx_1h
        operator: ">="
        threshold: 3
    logic: AND
    score: 90
    severity: "Très élevée"
    status: "Baseline v1.0 — à recalibrer via IA-8"

  - id: R09
    name: "Nouveau bénéficiaire + montant élevé"
    description: >
      Un transfert important est envoyé à un bénéficiaire jamais utilisé
      auparavant par ce compte. Cohérent avec un virement de fonds volés
      vers un compte contrôlé par l'attaquant.
    signals:
      - feature: new_beneficiary
        operator: "=="
        threshold: true
      - feature: amount_ratio
        operator: ">"
        threshold: 3
    logic: AND
    score: 78
    severity: "Élevée"
    status: "seuils appuyés par l'EDA"

  - id: R10
    name: "Accumulation de plusieurs signaux faibles"
    description: >
      Aucun signal individuel n'est critique, mais plusieurs indicateurs
      faibles se déclenchent simultanément. Filet de sécurité pour capter
      les fraudes qui ne correspondent à aucun scénario type ci-dessus.
    weak_signals:
      - feature: amount_ratio
        operator: ">"
        threshold: 2
      - feature: nb_tx_1h
        operator: ">="
        threshold: 2
      - feature: is_roaming
        operator: "=="
        threshold: true
      - feature: new_beneficiary
        operator: "=="
        threshold: true
    logic: WEAK_SIGNALS
    weak_signals_min: 3
    score: 88
    severity: "Très élevée"
    status: "Baseline v1.0 — à recalibrer via IA-8"

# ==============================================================================
# Dépendances bloquantes (rappel):
# - Toutes les features ci-dessus doivent être exposées par IA-3 (Feature Updater)
#   avant que ces règles puissent s'exécuter en pratique.
# - Ce fichier est lu depuis RULES_PATH (volume local) en développement.
#   En production AWS, il est chargé depuis S3 via l'endpoint /reload-rules.
# ==============================================================================
