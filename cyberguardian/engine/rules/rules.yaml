# ==============================================================================
# CyberGuardian AI — Moteur de règles (Couche 1) — IA-4
# Version: 2.0 (recalibrage sur le simulateur corrigé — 12 règles)
#
# Recalibrage v2.0 (mesuré sur 1 500 abonnés simulés, 80 473 transactions,
# 700 fraudes, toutes transactions confondues) :
#   Sur un simulateur réaliste (légitimes inhabituels, fraudes proches de
#   l'habitude), les signaux ISOLÉS (itinérance, vitesse, OTP, montant) ne
#   distinguent plus la fraude : précision 4 à 19 %. Combinés à un swap SIM
#   récent, ils redeviennent précis (76 à 83 %). Les règles sont donc
#   recentrées sur ces combinaisons ; les signaux isolés sont conservés avec un
#   score bas (information ou vérification OTP, sans alerte fraude).
#   Précision / rappel mesurés par règle indiqués dans chaque `status`.
#
# Rappel des zones de décision : < 30 PASS · 30-69 CHALLENGE (OTP) · ≥ 70 BLOCK.
# Seuil d'alerte fraude utilisé pour les mesures : score ≥ 50.
#
# Limite connue : VOL_TELEPHONE (vol de téléphone déverrouillé, sans swap)
# n'est détecté par aucune règle — même appareil, même lieu, pas de swap.
# Limite acceptée pour IA-7.
# ==============================================================================

version: "2.0"

rules:

  - id: R01
    name: "SIM swap récent + montant supérieur à l'habitude"
    description: >
      Transaction moins d'une heure après un swap SIM, pour un montant
      supérieur à 1,5 fois l'habitude. v1 exigeait ×3 : précision 95 % mais
      seulement 3 % des fraudes (les fraudes sont souvent proches de l'habitude).
    signals:
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 1
      - feature: amount_ratio
        operator: ">"
        threshold: 1.5
    logic: AND
    score: 92
    severity: "Très élevée"
    status: "v2.0 — précision 82 %, rappel 9 %"

  - id: R02
    name: "Nouveau device + montant supérieur à l'habitude"
    description: >
      Transaction depuis un appareil jamais vu, pour un montant supérieur à
      1,5 fois l'habitude. Précision insuffisante pour bloquer : vérification.
    signals:
      - feature: new_device
        operator: "=="
        threshold: true
      - feature: amount_ratio
        operator: ">"
        threshold: 1.5
    logic: AND
    score: 60
    severity: "Moyenne"
    status: "v2.0 — précision 41 %, rappel 4 % (v1 : ×3, 78 pts)"

  - id: R03
    name: "Nouveau device après SIM swap"
    description: >
      Un appareil jamais vu apparaît moins de 2 h après un swap SIM. Les
      swaps légitimes avec changement de téléphone produisent le même signal :
      vérification plutôt que blocage.
    signals:
      - feature: new_device
        operator: "=="
        threshold: true
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 2
    logic: AND
    score: 65
    severity: "Élevée"
    status: "v2.0 — précision 52 %, rappel 15 % (v1 : 93 pts)"

  - id: R04
    name: "Pic d'OTP après SIM swap"
    description: >
      Au moins 3 OTP dans l'heure, moins de 6 h après un swap SIM. Seul, un pic
      d'OTP est fréquent chez les légitimes (codes mal saisis, reconnexions) :
      précision 19 %.
    signals:
      - feature: otp_count_1h
        operator: ">="
        threshold: 3
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 6
    logic: AND
    score: 85
    severity: "Très élevée"
    status: "v2.0 — précision 82 %, rappel 17 % (v1 seul : 19 %)"

  - id: R05
    name: "Vélocité après SIM swap"
    description: >
      Au moins 3 transactions dans l'heure, moins de 6 h après un swap SIM
      (vidage en cours). Seule, la vélocité touche les gros consommateurs
      légitimes : précision 5 %.
    signals:
      - feature: nb_tx_1h
        operator: ">="
        threshold: 3
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 6
    logic: AND
    score: 85
    severity: "Très élevée"
    status: "v2.0 — précision 83 %, rappel 15 % (v1 seul ≥ 4 : 5 %)"

  - id: R06
    name: "Montant très supérieur à l'habitude"
    description: >
      Montant supérieur à 5 fois l'habitude, sans autre signal. Les achats
      importants légitimes sont fréquents : signal faible, vérification.
    signals:
      - feature: amount_ratio
        operator: ">"
        threshold: 5
    logic: SINGLE
    score: 40
    severity: "Faible"
    status: "v2.0 — précision 11 %, rappel 2 % (v1 : 68 pts)"

  - id: R07
    name: "Changement de région après SIM swap"
    description: >
      Transaction depuis une autre région que le domicile, moins de 6 h après
      un swap SIM. Combinaison la plus efficace de la couche.
    signals:
      - feature: is_roaming
        operator: "=="
        threshold: true
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 6
    logic: AND
    score: 80
    severity: "Très élevée"
    status: "v2.0 — précision 76 %, rappel 48 %, FPR 0,1 %"

  - id: R08
    name: "Cascade de transferts"
    description: >
      Plusieurs bénéficiaires en peu de temps. nb_beneficiaires_1h n'est
      qu'une approximation (≈ nb_tx_1h) : précision 4 %. Score bas en attendant
      un vrai décompte des bénéficiaires distincts.
    signals:
      - feature: nb_beneficiaires_1h
        operator: ">="
        threshold: 3
      - feature: nb_tx_1h
        operator: ">="
        threshold: 3
    logic: AND
    score: 40
    severity: "Faible"
    status: "v2.0 — précision 4 % (approximation), v1 : 90 pts"

  - id: R09
    name: "Nouveau bénéficiaire + montant élevé"
    description: >
      Transfert de plus de 3 fois l'habitude vers un bénéficiaire jamais
      utilisé. Fréquent chez les légitimes dans le simulateur actuel : signal faible.
    signals:
      - feature: new_beneficiary
        operator: "=="
        threshold: true
      - feature: amount_ratio
        operator: ">"
        threshold: 3
    logic: AND
    score: 40
    severity: "Faible"
    status: "v2.0 — précision 7 %, rappel 3 % (v1 : 78 pts)"

  - id: R10
    name: "Accumulation de plusieurs signaux faibles"
    description: >
      Au moins 3 signaux faibles simultanés. Précision 42 % : vérification
      plutôt que blocage.
    weak_signals:
      - feature: amount_ratio
        operator: ">"
        threshold: 2
      - feature: nb_tx_1h
        operator: ">="
        threshold: 2
      - feature: is_roaming
        operator: "=="
        threshold: true
      - feature: new_beneficiary
        operator: "=="
        threshold: true
    logic: WEAK_SIGNALS
    weak_signals_min: 3
    score: 65
    severity: "Élevée"
    status: "v2.0 — précision 42 %, rappel 14 % (v1 : 88 pts)"

  - id: R11
    name: "SIM swap très récent"
    description: >
      Transaction moins d'une heure après un swap SIM, quel que soit le
      montant. Les clients légitimes utilisent aussi leur ligne juste après un
      swap : vérification OTP, pas de blocage.
    signals:
      - feature: hours_since_sim_swap
        operator: "<"
        threshold: 1
    logic: SINGLE
    score: 60
    severity: "Moyenne"
    status: "v2.0 (nouvelle) — précision 63 %, rappel 49 %"

  - id: R12
    name: "Changement de région"
    description: >
      Transaction depuis une autre région que le domicile, sans swap récent.
      Un voyage est légitime : information seulement (score sous PASS).
    signals:
      - feature: is_roaming
        operator: "=="
        threshold: true
    logic: SINGLE
    score: 25
    severity: "Information"
    status: "v2.0 (nouvelle, ex-R07 v1.1) — précision 10 %, FPR 3,7 %"

# ==============================================================================
# Dépendances bloquantes (rappel):
# - Toutes les features ci-dessus doivent être exposées par IA-3 (Feature Updater)
#   avant que ces règles puissent s'exécuter en pratique.
# - Ce fichier est lu depuis RULES_PATH (volume local) en développement.
#   En production AWS, il est chargé depuis S3 via l'endpoint /reload-rules.
# ==============================================================================
